<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - My Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .box {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #0a7d2c;
            margin-top: 15px;
        }

        form p {
            margin: 12px 0;
        }

        form label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }

        form input,
        form textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .errorlist {
            color: red;
            padding-left: 18px;
            margin: 4px 0;
        }

        button {
            background: #0a7d2c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #222;
        }
    </style>
</head>

<body>
    <header>
        <h1><a href="{% url 'product_list' %}">My Store</a></h1>
    </header>
    <div class="container">
        <a class="back" href="{% url 'cart_detail' %}">&larr; Back to cart</a>

        <div class="box">
            <h2>Order Summary</h2>
            <table>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>
                {% for item in cart.items.all %}
                <tr>
                    <td>{{ item.product.name }}</td>
                    <td>{{ item.quantity }}</td>
                    <td>₹{{ item.subtotal }}</td>
                </tr>
                {% endfor %}
            </table>
            <p class="total">Total: ₹{{ cart.total_price }}</p>
        </div>

        <div class="box">
            <h2>Delivery Details</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <p><strong>Payment method:</strong> Cash on Delivery</p>
                <button type="submit">Place Order</button>
            </form>
        </div>
    </div>
</body>

</html>
