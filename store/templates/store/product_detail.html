<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - My Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .box {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .price {
            color: #0a7d2c;
            font-weight: bold;
            font-size: 24px;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #222;
        }
    </style>
</head>

<body>
    <header>
        <h1><a href="{% url 'product_list' %}">My Store</a></h1>
    </header>
    <div class="container">
        <a class="back" href="{% url 'product_list' %}">&larr; Back to products</a>
        <div class="box">
            <h2>{{ product.name }}</h2>
            <p>Category: {{ product.category.name }}</p>
            <p>{{ product.description }}</p>
            <p class="price">₹{{ product.price }}</p>
            <p>Stock: {{ product.stock }}</p>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'add_to_cart' product.pk %}">
                {% csrf_token %}
                <button type="submit"
                    style="background:#222;color:white;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;">Add
                    to Cart</button>
            </form>
            {% else %}
            <p><a href="{% url 'login' %}">Login karo</a> cart mein add karne ke liye.</p>
            {% endif %}
        </div>
    </div>
</body>

</html>
