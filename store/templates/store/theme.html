<style>
    html[data-theme="dark"] body {
        background: #0f1115;
        color: #e5e7eb;
    }

    html[data-theme="dark"] header {
        background: #0b0d11;
    }

    html[data-theme="dark"] header a {
        color: white !important;
    }

    html[data-theme="dark"] .card,
    html[data-theme="dark"] .box {
        background: #181b22 !important;
        color: #e5e7eb;
        box-shadow: none;
        border: 1px solid #2a2f3a;
    }

    html[data-theme="dark"] th,
    html[data-theme="dark"] td {
        border-bottom-color: #2a2f3a;
    }

    html[data-theme="dark"] a {
        color: #60a5fa;
    }

    html[data-theme="dark"] .price,
    html[data-theme="dark"] .total {
        color: #34d399;
    }

    html[data-theme="dark"] .back {
        color: #e5e7eb;
    }

    html[data-theme="dark"] .success {
        background: #12301f;
        color: #34d399;
    }

    html[data-theme="dark"] input,
    html[data-theme="dark"] textarea,
    html[data-theme="dark"] select {
        background: #0f1115;
        color: #e5e7eb;
        border: 1px solid #374151;
    }

    html[data-theme="dark"] .helptext {
        color: #9ca3af;
    }

    html[data-theme="dark"] .card div[style*="background:#eee"] {
        background: #2a2f3a !important;
        color: #9ca3af !important;
    }

    #theme-toggle {
        position: fixed;
        right: 18px;
        bottom: 18px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid #9ca3af;
        background: #ffffff;
        color: #222;
        font-size: 22px;
        cursor: pointer;
        z-index: 999;
        line-height: 1;
    }

    html[data-theme="dark"] #theme-toggle {
        background: #181b22;
        color: #fbbf24;
        border-color: #4b5563;
    }
</style>
<script>
    (function () {
        try {
            var saved = localStorage.getItem("theme");
            if (saved) { document.documentElement.setAttribute("data-theme", saved); }
        } catch (e) { }
    })();
    document.addEventListener("DOMContentLoaded", function () {
        var btn = document.createElement("button");
        btn.id = "theme-toggle";
        btn.type = "button";
        btn.title = "Dark mode";
        btn.textContent = "\u263E";
        btn.onclick = function () {
            var d = document.documentElement;
            var t = d.getAttribute("data-theme") === "dark" ? "light" : "dark";
            d.setAttribute("data-theme", t);
            try { localStorage.setItem("theme", t); } catch (e) { }
        };
        document.body.appendChild(btn);
    });
</script>
