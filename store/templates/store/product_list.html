<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin: 0 0 8px;
        }

        .price {
            color: #0a7d2c;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>My Store</h1>
        <div>
            {% if user.is_authenticated %}
            Hello, {{ user.username }} |
            <a href="{% url 'cart_detail' %}" style="color:white;">Cart</a> |
            <a href="{% url 'order_list' %}" style="color:white;">My Orders</a> |
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit"
                    style="background:none;border:none;color:white;cursor:pointer;text-decoration:underline;">Logout</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}" style="color:white;">Login</a> |
            <a href="{% url 'register' %}" style="color:white;">Register</a>
            {% endif %}
        </div>
    </header>
    <div class="container">
        <div class="grid">
            {% for product in products %}
            <div class="card">
                <h3><a href="{% url 'product_detail' product.pk %}">{{ product.name }}</a></h3>
                <p class="price">₹{{ product.price }}</p>
                <a href="{% url 'product_detail' product.pk %}">View details &rarr;</a>
            </div>
            {% empty %}
            <p>No products yet.</p>
            {% endfor %}
        </div>
    </div>
</body>

</html>
